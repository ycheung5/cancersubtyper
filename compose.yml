name: cancersubtyper

services:
  db:
    image: postgres:17-alpine
    restart: always
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    image: python:3.11-slim-bookworm
    working_dir: /app
    restart: always
    env_file:
      - ./api/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - api_venv:/opt/venv
    command: ["sh", "/app/scripts/dev-python-service.sh", "api"]

  app:
    image: node:22-alpine
    working_dir: /app
    depends_on:
      - api
    ports:
      - "5173:5173"
    env_file:
      - ./app/.env
    volumes:
      - ./app:/app
      - ./app/node_modules:/app/node_modules
    command:
      - sh
      - -c
      - npm install && npm run dev -- --host 0.0.0.0 --port 5173

  redis:
    image: redis:7.4-alpine
    profiles: ["jobs"]

  celery_worker:
    image: python:3.11-slim-bookworm
    working_dir: /app
    profiles: ["jobs"]
    env_file:
      - ./api/.env
    depends_on:
      - db
      - api
      - redis
    volumes:
      - ./api:/app
      - api_venv:/opt/venv
      - worker_r_libs:/opt/r-libs
    environment:
      R_LIBS_USER: /opt/r-libs
    command: ["sh", "/app/scripts/dev-python-service.sh", "worker"]

  flower:
    image: python:3.11-slim-bookworm
    working_dir: /app
    profiles: ["jobs"]
    env_file:
      - ./api/.env
    depends_on:
      - redis
      - celery_worker
    ports:
      - "5556:5555"
    volumes:
      - ./api:/app
      - api_venv:/opt/venv
    command: ["sh", "/app/scripts/dev-python-service.sh", "flower"]

volumes:
  postgres_data:
  api_venv:
  worker_r_libs:
